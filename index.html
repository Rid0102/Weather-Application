<html>

    <head>


        <title>My Website</title>
        <link rel="stylesheet" href="Styles/style.css">

    </head>

    <body>

        <!-- search box for user -->
        <div id="searchContainer">
            <input class="searchControl" type="text" placeholder="City Name or Zip Code" id="searchInput">
            <button class="searchControl" id="searchBtn">Search</button>
        </div>
        <!-- Div container for weather information -->
        <div id="weatherContainer">
            <!-- Shows the city name to user  -->
            <div id="weatherDescription">
                <h1 id="cityHeader"></h1>
                <!-- shows weather to user -->
                <div id="weatherMain">
            
                    <div id="temperature"></div>
                    <div id="weatherDescriptionHeader"></div> 
                    <div id="documentIconImg"></div>   
                </div>
                <hr>
                <div id="windSpeed" class="bottomDeatils"></div>
                <div id="humidity" class="bottomDetails"></div>
            </div>
        </div>
        <script src="Js/script.js"></script>
    </body>
 
</html>
